name: Public tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked
      - run: uv run --no-sync pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t test-toy-python:ci .
      - run: >-
          timeout 60s docker run --rm --network none --cpus 1 --memory 256m
          --pids-limit 64 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          test-toy-python:ci
