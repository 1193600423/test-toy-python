[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "test-toy-python"
version = "0.1.0"
description = "Small, intentionally imperfect order library for issue-agent experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/toy_orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
